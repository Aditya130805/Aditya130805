<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Aditya Agarwal</title>
  <desc id="d">A career timeline: Launch Ventures, Yamaha Motor, EDP Renewables, Boxsy, and Adobe, with projects built along the way.</desc>
  <defs>
  <style>
    .ink   { fill: #1f2328; }
    .muted { fill: #57606a; }
    .accent{ fill: #0969da; }
    .rule  { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .dot   { fill: #1f2328; }
    .odot  { fill: none; stroke: #57606a; stroke-width: 1.2; }
    .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <linearGradient id="spine" gradientUnits="userSpaceOnUse" x1="60" y1="240" x2="850" y2="240">
      <stop offset="0.00" stop-color="#d0d7de" stop-opacity="0"/>
      <stop offset="0.07" stop-color="#d0d7de" stop-opacity="1"/>
      <stop offset="0.93" stop-color="#d0d7de" stop-opacity="1"/>
      <stop offset="1.00" stop-color="#d0d7de" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text class="ink serif" x="450" y="74" text-anchor="middle" font-size="38" letter-spacing="9">ADITYA AGARWAL</text>
  <line class="rule" x1="366" y1="95" x2="534" y2="95"/>
  <text class="accent sans" x="450" y="120" text-anchor="middle" font-size="11" letter-spacing="4.5">SOFTWARE ENGINEER &#183; PURDUE CS '27</text>

  <line x1="60" y1="240" x2="850" y2="240" stroke="url(#spine)" stroke-width="1"/>

  <text class="muted sans" x="100" y="190" text-anchor="middle" font-size="10" letter-spacing="1.1">MAY &#8211; AUG 2024</text>
  <text class="ink serif" x="100" y="215" text-anchor="middle" font-size="15.5">Launch Ventures</text>
  <circle class="dot" cx="100" cy="240" r="3.6"/>

  <text class="muted sans" x="275" y="190" text-anchor="middle" font-size="10" letter-spacing="1.1">AUG 2024 &#8211; MAY 2025</text>
  <text class="ink serif" x="275" y="215" text-anchor="middle" font-size="15.5">Yamaha Motor</text>
  <circle class="dot" cx="275" cy="240" r="3.6"/>
  <line class="rule" x1="275" y1="252" x2="275" y2="302"/>
  <circle class="odot" cx="275" cy="308" r="3"/>
  <text class="ink serif" x="275" y="333" text-anchor="middle" font-size="13.5">BoilerMake XII</text>
  <text class="muted sans" x="275" y="350" text-anchor="middle" font-size="9.5" letter-spacing="0.3">2nd overall, AI interviews</text>

  <text class="muted sans" x="450" y="190" text-anchor="middle" font-size="10" letter-spacing="1.1">JUN &#8211; AUG 2025</text>
  <text class="ink serif" x="450" y="215" text-anchor="middle" font-size="15.5">EDP Renewables</text>
  <circle class="dot" cx="450" cy="240" r="3.6"/>
  <line class="rule" x1="450" y1="252" x2="450" y2="302"/>
  <circle class="odot" cx="450" cy="308" r="3"/>
  <text class="ink serif" x="450" y="333" text-anchor="middle" font-size="13.5">WallPreview</text>
  <text class="muted sans" x="450" y="350" text-anchor="middle" font-size="9.5" letter-spacing="0.3">wallpaper preview, CV</text>

  <text class="muted sans" x="625" y="190" text-anchor="middle" font-size="10" letter-spacing="1.1">AUG &#8211; DEC 2025</text>
  <text class="ink serif" x="625" y="215" text-anchor="middle" font-size="15.5">Boxsy</text>
  <circle class="dot" cx="625" cy="240" r="3.6"/>
  <line class="rule" x1="625" y1="252" x2="625" y2="302"/>
  <circle class="odot" cx="625" cy="308" r="3"/>
  <text class="ink serif" x="625" y="333" text-anchor="middle" font-size="13.5">Cardigarch</text>
  <text class="muted sans" x="625" y="350" text-anchor="middle" font-size="9.5" letter-spacing="0.3">realtime multiplayer</text>

  <text class="muted sans" x="800" y="190" text-anchor="middle" font-size="10" letter-spacing="1.1">MAY &#8211; AUG 2026</text>
  <text class="accent serif" x="800" y="215" text-anchor="middle" font-size="17">Adobe</text>
  <circle class="rule" cx="800" cy="240" r="9.5" opacity="0.55"/>
  <circle class="accent" cx="800" cy="240" r="5"/>
  <line class="rule" x1="800" y1="252" x2="800" y2="302"/>
  <circle class="odot" cx="800" cy="308" r="3"/>
  <text class="ink serif" x="800" y="333" text-anchor="middle" font-size="13.5">CraftCover</text>
  <text class="muted sans" x="800" y="350" text-anchor="middle" font-size="9.5" letter-spacing="0.3">cover letters, fast</text>
</svg>
