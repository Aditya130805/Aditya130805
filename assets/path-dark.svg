<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-labelledby="title desc">
  <title id="title">Aditya's path</title>
  <desc id="desc">Work above the line: Launch Ventures, Yamaha, EDP Renewables, Boxsy, Adobe. Projects below: BoilerMake, WallPreview, Cardigarch, TravelMontage.</desc>
  <defs>
    <style>
      .co { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .now { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .yr { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; }
      .pr { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; }
      .hint { fill: #6e7681; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 0.04em; }
      .stem { stroke: #30363d; stroke-width: 1; fill: none; }
      .dot { fill: #e6edf3; }
      .ring { fill: #0d1117; stroke: #58a6ff; stroke-width: 2; }
      .core { fill: #58a6ff; }
    </style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text class="hint" x="48" y="28">WORK</text>
  <text class="hint" x="48" y="188">BUILT</text>

  <line x1="40" y1="100" x2="880" y2="100" stroke="url(#fade)" stroke-width="1.5"/>

  <text class="co" x="90" y="52" text-anchor="middle">Launch Ventures</text>
  <text class="yr" x="90" y="72" text-anchor="middle">2024</text>
  <circle class="dot" cx="90" cy="100" r="4"/>

  <text class="co" x="270" y="52" text-anchor="middle">Yamaha</text>
  <text class="yr" x="270" y="72" text-anchor="middle">2024  25</text>
  <circle class="dot" cx="270" cy="100" r="4"/>
  <line class="stem" x1="270" y1="108" x2="270" y2="145"/>
  <circle class="dot" cx="270" cy="148" r="2.5" opacity="0.45"/>
  <text class="pr" x="270" y="170" text-anchor="middle">BoilerMake · 2nd</text>

  <text class="co" x="450" y="52" text-anchor="middle">EDP Renewables</text>
  <text class="yr" x="450" y="72" text-anchor="middle">2025</text>
  <circle class="dot" cx="450" cy="100" r="4"/>
  <line class="stem" x1="450" y1="108" x2="450" y2="145"/>
  <circle class="dot" cx="450" cy="148" r="2.5" opacity="0.45"/>
  <text class="pr" x="450" y="170" text-anchor="middle">WallPreview</text>

  <text class="co" x="630" y="52" text-anchor="middle">Boxsy</text>
  <text class="yr" x="630" y="72" text-anchor="middle">2025</text>
  <circle class="dot" cx="630" cy="100" r="4"/>
  <line class="stem" x1="630" y1="108" x2="630" y2="145"/>
  <circle class="dot" cx="630" cy="148" r="2.5" opacity="0.45"/>
  <text class="pr" x="630" y="170" text-anchor="middle">Cardigarch</text>

  <text class="now" x="810" y="52" text-anchor="middle">Adobe</text>
  <text class="yr" x="810" y="72" text-anchor="middle">now</text>
  <circle class="ring" cx="810" cy="100" r="7"/>
  <circle class="core" cx="810" cy="100" r="3.5"/>
  <line class="stem" x1="810" y1="110" x2="810" y2="145"/>
  <circle class="dot" cx="810" cy="148" r="2.5" opacity="0.45"/>
  <text class="pr" x="810" y="170" text-anchor="middle">TravelMontage</text>
</svg>
