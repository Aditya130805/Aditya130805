  <text class="accent sans" x="190" y="82" text-anchor="middle" font-size="8.5" letter-spacing="2.4">SOFTWARE ENGINEER &#183; PURDUE CS '27</text>

  <line x1="46" y1="112" x2="46" y2="568" stroke="url(#spine)" stroke-width="1"/>

