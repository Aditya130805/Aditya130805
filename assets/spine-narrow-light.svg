  <circle class="dot" cx="46" cy="208" r="3.4"/>
  <text class="ink serif" x="66" y="213" font-size="15">Yamaha Motor</text>
  <text class="muted sans" x="66" y="229" font-size="9.5" letter-spacing="1">AUG 2024 &#8211; MAY 2025</text>
