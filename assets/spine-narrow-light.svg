  <text class="muted sans" x="66" y="505" font-size="9.5" letter-spacing="1">MAY &#8211; AUG 2026</text>
  <line class="rule" x1="46" y1="532" x2="58" y2="532"/>
  <circle class="odot" cx="62" cy="532" r="2.8"/>
  <text class="ink serif" x="76" y="536" font-size="12.5">CraftCover</text>
  <text class="muted sans" x="76" y="550" font-size="9">cover letters, fast</text>
